<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Amber / Gold Guitar Headstock & Body Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Neon Sky Blue / Sapphire Gradient for Notes & Staff -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Subtle Golden Neon Glow Filter -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Vibrant Cyan Glow Filter -->
    <filter id="glowSky" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Squircle Clip for App Icon -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- Outer Drop Shadow -->
  <rect x="24" y="28" width="464" height="464" rx="104" ry="104" fill="#000000" opacity="0.45" filter="url(#glowGold)" />

  <!-- Main Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGlow)" stroke="#334155" stroke-width="4" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="none" stroke="#64748b" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Icon Artwork Container with Clip -->
  <g clip-path="url(#squircleClip)">
    <!-- Ambient Inner Background Radial Accents -->
    <circle cx="160" cy="180" r="140" fill="#f59e0b" opacity="0.12" filter="url(#glowGold)" />
    <circle cx="360" cy="340" r="160" fill="#0284c7" opacity="0.15" filter="url(#glowSky)" />

    <!-- Musical Staff Waves Across Background -->
    <g opacity="0.22" stroke="#94a3b8" stroke-width="2.5" fill="none">
      <path d="M -20 220 C 120 180, 240 250, 530 190" />
      <path d="M -20 240 C 120 200, 240 270, 530 210" />
      <path d="M -20 260 C 120 220, 240 290, 530 230" />
      <path d="M -20 280 C 120 240, 240 310, 530 250" />
      <path d="M -20 300 C 120 260, 240 330, 530 270" />
    </g>

    <!-- Guitar Neck & Headstock Silhouette (Stylized Isometric Angled) -->
    <g transform="rotate(-28 256 256)">
      <!-- Guitar Fretboard Neck -->
      <path d="M 216 110 L 296 110 L 316 480 L 196 480 Z" fill="#1e1e24" stroke="#475569" stroke-width="3" />
      
      <!-- Fret Wires -->
      <line x1="213" y1="170" x2="299" y2="170" stroke="#94a3b8" stroke-width="3.5" />
      <line x1="209" y1="235" x2="303" y2="235" stroke="#94a3b8" stroke-width="3.5" />
      <line x1="205" y1="305" x2="307" y2="305" stroke="#94a3b8" stroke-width="3.5" />
      <line x1="201" y1="380" x2="311" y2="380" stroke="#94a3b8" stroke-width="3.5" />

      <!-- Fret Marker Inlays (Pearloid Dots) -->
      <circle cx="256" cy="202" r="5.5" fill="#f8fafc" opacity="0.85" />
      <circle cx="256" cy="270" r="5.5" fill="#f8fafc" opacity="0.85" />
      <circle cx="256" cy="342" r="5.5" fill="#f8fafc" opacity="0.85" />

      <!-- Guitar Nut -->
      <rect x="214" y="104" width="84" height="12" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />

      <!-- 6 Glowing Guitar Strings -->
      <line x1="222" y1="90" x2="210" y2="480" stroke="#e2e8f0" stroke-width="3.8" opacity="0.9" />
      <line x1="236" y1="90" x2="228" y2="480" stroke="#e2e8f0" stroke-width="3.2" opacity="0.9" />
      <line x1="250" y1="90" x2="246" y2="480" stroke="#fcd34d" stroke-width="2.8" opacity="0.95" />
      <line x1="262" y1="90" x2="266" y2="480" stroke="#fcd34d" stroke-width="2.4" opacity="0.95" />
      <line x1="276" y1="90" x2="284" y2="480" stroke="#38bdf8" stroke-width="2.0" opacity="0.95" />
      <line x1="290" y1="90" x2="302" y2="480" stroke="#38bdf8" stroke-width="1.6" opacity="0.95" />
    </g>

    <!-- Stylized Modern Acoustic Guitar Pick Shape In Backing -->
    <path d="M 256 65 C 380 65, 435 170, 395 310 C 365 410, 280 445, 256 460 C 232 445, 147 410, 117 310 C 77 170, 132 65, 256 65 Z" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="5" 
          opacity="0.4" />

    <!-- Centerpiece: Luminous Treble Clef Intertwined with Golden Flame & Cyan Glow -->
    <g transform="translate(185, 80) scale(1.15)">
      <!-- Outer Treble Clef Glow Silhouette -->
      <text x="50" y="240" font-family="'Times New Roman', serif" font-size="280" font-weight="bold" fill="url(#goldGradient)" filter="url(#glowGold)" opacity="0.55">𝄞</text>
      
      <!-- Crisp Foreground Treble Clef -->
      <text x="50" y="240" font-family="'Times New Roman', serif" font-size="280" font-weight="bold" fill="url(#goldGradient)">𝄞</text>
    </g>

    <!-- Floating Vibrant Musical Notes with Neon Light -->
    <!-- Top-Right Glowing Note -->
    <g transform="translate(370, 115) scale(0.9)" filter="url(#glowSky)">
      <circle cx="20" cy="50" r="14" fill="#38bdf8" />
      <rect x="30" y="10" width="4" height="42" fill="#38bdf8" rx="2" />
      <path d="M 34 10 C 50 14, 55 30, 52 40 C 47 28, 40 22, 34 20 Z" fill="#38bdf8" />
    </g>

    <!-- Bottom-Left Glowing Note -->
    <g transform="translate(85, 330) scale(0.85)" filter="url(#glowGold)">
      <ellipse cx="25" cy="45" rx="16" ry="12" transform="rotate(-25 25 45)" fill="#fbbf24" />
      <rect x="35" y="8" width="4.5" height="38" fill="#fbbf24" rx="2" />
    </g>

    <!-- Sparkle Stars -->
    <g fill="#ffffff" opacity="0.9">
      <!-- Top sparkle -->
      <path d="M 125 120 Q 125 135 140 135 Q 125 135 125 150 Q 125 135 110 135 Q 125 135 125 120 Z" />
      <!-- Right sparkle -->
      <path d="M 410 260 Q 410 272 422 272 Q 410 272 410 284 Q 410 272 398 272 Q 410 272 410 260 Z" />
      <!-- Small sparkle -->
      <circle cx="340" cy="85" r="2.5" fill="#fef08a" />
      <circle cx="100" cy="270" r="2" fill="#bae6fd" />
    </g>
  </g>
</svg>
